# docker-compose (stable) - MySQL and Redis only for local builds
services:
  # MySQL database
  mysql:
    image: mysql:8.4.8
    container_name: aquachatmysql
    restart: always
    ports:
      - "3306:3306"  # host 3306 -> container 3306
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aquachatmysql
      MYSQL_USER: aquachat
      MYSQL_PASSWORD: cyberis999@
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - ./db:/var/lib/aquachatmysql
    networks:
      - aquachat-network

  # Redis cache
  redis:
    image: redis:7.4.7-alpine3.21
    container_name: aquachatredis
    restart: always
    ports:
      - "6379:6379"  # host 6379 -> container 6379
    expose:
      - "6379"
    volumes:
      - ./redis:/aquachatredis
    networks:
      - aquachat-network

networks:
  aquachat-network:
    driver: bridge
